<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Inputs</title>
</head>
<body>
    <h3>Using the input tag</h3>
    <form action="">
         <label for="">Your Name:</label>

        <button>Read More</button>

    </form>
   

</body>
